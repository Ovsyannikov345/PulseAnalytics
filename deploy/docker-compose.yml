name: pulse-analytics

services:
  weakapp:
    build:
      context: https://github.com/nantonov/WeakApp.git#c6451dc54c65e066ff8f42671bb99461793845fd
    image: pulse-analytics/weakapp:c6451dc
    ports:
      - "${WEAKAPP_PORT:-5000}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in deploy/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in deploy/.env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  seq:
    image: datalust/seq:2025.2
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?Set SEQ_ADMIN_PASSWORD in deploy/.env}
    ports:
      - "${SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data
    restart: unless-stopped

  data-ingestor:
    image: ilyaovsyannikov/pulse-analytics-data-ingestor:${DATA_INGESTOR_TAG:-latest}
    environment:
      WeakApp__BaseUrl: http://weakapp:8080
      WeakApp__ApiKey: ${WEAKAPP_API_KEY:?Set WEAKAPP_API_KEY in deploy/.env}
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:?Set RABBITMQ_USER in deploy/.env}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in deploy/.env}
      Seq__ServerUrl: http://seq:5341
      Seq__ApiKey: ${SEQ_API_KEY:-}
    ports:
      - "${DATA_INGESTOR_PORT:-5101}:8080"
    depends_on:
      weakapp:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    restart: unless-stopped

volumes:
  rabbitmq-data:
  seq-data:
