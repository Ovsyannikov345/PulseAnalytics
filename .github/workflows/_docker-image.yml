name: Docker image (reusable)

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context (containing the Dockerfile), relative to the repo root
        required: true
        type: string
      image:
        description: Docker Hub repository name, without the namespace
        required: true
        type: string
      push:
        description: Push the image to Docker Hub; when false the image is only built
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        description: Docker Hub access token, required when push is true
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build${{ inputs.push && ' and push' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ inputs.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build${{ inputs.push && ' and push' || '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
