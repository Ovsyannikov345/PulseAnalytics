name: .NET Sonar analysis (reusable)

on:
  workflow_call:
    inputs:
      solution:
        description: Path to the solution file, relative to the repo root
        required: true
        type: string
      project-key:
        description: SonarQube Cloud project key
        required: true
        type: string
      coverage-exclusions:
        description: Comma-separated globs excluded from coverage (not from analysis)
        required: false
        type: string
        default: ""
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

env:
  SONAR_SCANNER_VERSION: 11.3.0
  SONAR_HOST_URL: https://sonarcloud.io
  SONAR_ORGANIZATION: ovsyannikov345

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache Sonar packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ env.SONAR_SCANNER_VERSION }}

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner --version ${{ env.SONAR_SCANNER_VERSION }}
        
      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"${{ inputs.project-key }}"
          /o:"${{ env.SONAR_ORGANIZATION }}"
          /d:sonar.host.url="${{ env.SONAR_HOST_URL }}"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.vscoveragexml.reportsPaths="${{ runner.temp }}/coverage/**/*.xml"
          /d:sonar.qualitygate.wait=true
          /d:sonar.coverage.exclusions="${{ inputs.coverage-exclusions }}"

      - name: Build
        run: dotnet build ${{ inputs.solution }} --configuration Release
        
      - name: Test with coverage
        run: >
          dotnet test ${{ inputs.solution }}
          --configuration Release
          --no-build
          --filter "Category!=Integration"
          --collect "Code Coverage;Format=xml"
          --results-directory "${{ runner.temp }}/coverage"

      - name: End analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
