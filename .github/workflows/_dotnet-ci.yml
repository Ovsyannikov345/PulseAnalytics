name: .NET CI (reusable)

on:
  workflow_call:
    inputs:
      solution:
        description: Path to the solution file, relative to the repo root
        required: true
        type: string
      integration-tests:
        description: Also run the tests marked Category=Integration (they start Docker containers via Testcontainers)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ inputs.solution }}

      - name: Build
        run: dotnet build ${{ inputs.solution }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ inputs.solution }} --configuration Release --no-build --filter "Category!=Integration"

      - name: Integration tests
        if: inputs.integration-tests
        run: dotnet test ${{ inputs.solution }} --configuration Release --no-build --filter "Category=Integration"
