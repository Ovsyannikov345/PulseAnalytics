name: Data Processor CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - services/DataProcessor/**
      - .github/workflows/data-processor.yml
      - .github/workflows/_dotnet-ci.yml
      - .github/workflows/_dotnet-sonar.yml
      - .github/workflows/_docker-image.yml
  push:
    branches: [main]
    paths:
      - services/DataProcessor/**
      - .github/workflows/data-processor.yml
      - .github/workflows/_dotnet-ci.yml
      - .github/workflows/_dotnet-sonar.yml
      - .github/workflows/_docker-image.yml

concurrency:
  group: data-processor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: github.event_name == 'push' || !github.event.pull_request.draft
    uses: ./.github/workflows/_dotnet-ci.yml
    with:
      solution: services/DataProcessor/DataProcessor.slnx
      integration-tests: ${{ github.event_name == 'push' }}

  sonar:
    name: Sonar
    if: github.event_name == 'push' || !github.event.pull_request.draft
    uses: ./.github/workflows/_dotnet-sonar.yml
    with:
      solution: services/DataProcessor/DataProcessor.slnx
      project-key: Ovsyannikov345_PulseAnalytics_DataProcessor
      coverage-exclusions: "**/Program.cs,**/DependencyInjection.cs,**/Topology/*.cs"
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker
    needs: [ci, sonar]
    uses: ./.github/workflows/_docker-image.yml
    with:
      context: services/DataProcessor
      image: pulse-analytics-data-processor
      push: ${{ github.event_name == 'push' }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
